spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/your_db
    username: your_user
    password: your_pwd
server:
  port: 8081
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.kuang.geoslopefix.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
